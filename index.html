<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1117">
<title>mr.AI</title>

<style>
:root {
  --bg:#0b1117;
  --panel:#141d26;
  --ink:#e8eef4;
  --mute:#8a99a8;
  --line:#24313d;
  --acc:#4d9bff;
  --me:#1d2b3a;
  --code:#080d12;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body {
  background:var(--bg);
  color:var(--ink);
  font:16px/1.6 system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
header {
  padding:14px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--panel);
}
h1 {
  margin:0;
  font-size:23px;
  flex:1;
}
h1 b { color:var(--acc); }
button { cursor:pointer; }
.ghost {
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  border-radius:10px;
  padding:8px 12px;
}
#log {
  flex:1;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:16px;
  max-width:850px;
  width:100%;
  margin:auto;
}
.empty {
  margin:auto;
  text-align:center;
  color:var(--mute);
  max-width:450px;
}
.empty h2 { color:var(--ink); }
.chips {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
.chip {
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  border-radius:15px;
  padding:9px 13px;
  font:inherit;
  font-size:14px;
}
.msg { overflow-wrap:anywhere; }
.me {
  align-self:flex-end;
  max-width:88%;
  background:var(--me);
  padding:10px 14px;
  border-radius:14px 14px 4px 14px;
  white-space:pre-wrap;
}
.ai { align-self:stretch; }
.ai p { margin:0 0 .8em; }
.ai h3,.ai h4 { margin:1em 0 .4em; }
.ai ul,.ai ol { padding-left:1.5em; }
.ai a { color:var(--acc); }
.ai code {
  background:var(--panel);
  padding:2px 5px;
  border-radius:5px;
}
.pre {
  margin:10px 0;
  background:var(--code);
  border-radius:10px;
  overflow:hidden;
}
.pre .hd {
  display:flex;
  justify-content:space-between;
  padding:7px 12px;
  background:#ffffff12;
  color:#9fb0c0;
  font-size:12px;
}
.pre pre {
  margin:0;
  padding:14px;
  overflow-x:auto;
  color:#e6edf3;
  font:13px/1.5 monospace;
}
.cp {
  background:transparent;
  border:1px solid #ffffff33;
  color:white;
  border-radius:6px;
  padding:4px 9px;
}
.status { color:var(--mute); }
.bar {
  border-top:1px solid var(--line);
  background:var(--panel);
  padding:12px;
}
.row {
  max-width:850px;
  margin:auto;
  display:flex;
  gap:8px;
  align-items:flex-end;
}
textarea {
  flex:1;
  resize:none;
  max-height:150px;
  min-height:45px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  border-radius:12px;
  padding:10px 12px;
  font:inherit;
}
#go {
  border:0;
  border-radius:12px;
  background:var(--acc);
  color:#06101c;
  font-weight:700;
  padding:0 17px;
  height:45px;
}
#go:disabled { opacity:.5; }
</style>
</head>

<body>

<header>
  <h1>mr<b>.</b>AI</h1>
  <button class="ghost" id="new">Новый чат</button>
</header>

<div id="log"></div>

<div class="bar">
  <div class="row">
    <textarea id="q" rows="1"
      placeholder="Напишите сообщение..."></textarea>
    <button id="go">Отправить</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const log = $("log");
const q = $("q");
const go = $("go");

let history = [];
let busy = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;"
}[c]));

function inline(s) {
  s = esc(s);

  const codes = [];

  s = s.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return "\u0000" + (codes.length - 1) + "\u0000";
  });

  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/\*([^*]+)\*/g, "<em>$1</em>");

  return s.replace(/\u0000(\d+)\u0000/g,
    (_, i) => "<code>" + codes[i] + "</code>");
}

function block(t) {
  let out = "";
  let list = null;

  const close = () => {
    if (list) {
      out += "</" + list + ">";
      list = null;
    }
  };

  for (const line of t.split("\n")) {
    let m;

    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      close();
      const n = m[1].length + 2;
      out += "<h" + n + ">" + inline(m[2]) +
        "</h" + n + ">";
    }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) {
      if (list !== "ul") {
        close();
        out += "<ul>";
        list = "ul";
      }
      out += "<li>" + inline(m[1]) + "</li>";
    }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== "ol") {
        close();
        out += "<ol>";
        list = "ol";
      }
      out += "<li>" + inline(m[1]) + "</li>";
    }
    else {
      close();
      if (line.trim()) out += "<p>" + inline(line) + "</p>";
    }
  }

  close();
  return out;
}

function md(t) {
  const parts = t.split(/```/);
  let out = "";

  parts.forEach((p, i) => {
    if (i % 2 === 0) {
      out += block(p);
    } else {
      const match = p.match(/^\s*([\w+#.-]*)\s*\n/);
      const lang = match ? match[1] : "код";
      const code = match ? p.slice(match[0].length) : p;

      out += '<div class="pre">' +
        '<div class="hd"><span>' + esc(lang) +
        '</span><button class="cp">Копировать</button></div>' +
        '<pre>' + esc(code.replace(/\n$/, "")) +
        '</pre></div>';
    }
  });

  return out;
}

function welcome() {
  log.innerHTML =
    '<div class="empty">' +
    '<h2>Чем могу помочь?</h2>' +
    '<p>Я mr.AI — ваш ИИ-помощник.</p>' +
    '<div class="chips"></div></div>';

  const examples = [
    "Расскажи интересный факт",
    "Напиши код на Python",
    "Объясни сложную тему простыми словами"
  ];

  examples.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = t;
    b.onclick = () => {
      q.value = t;
      send();
    };
    log.querySelector(".chips").appendChild(b);
  });
}

function add(cls, html) {
  const empty = log.querySelector(".empty");
  if (empty) empty.remove();

  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;

  log.appendChild(d);
  log.scrollTop = log.scrollHeight;

  return d;
}

log.addEventListener("click", async e => {
  if (!e.target.classList.contains("cp")) return;

  const code = e.target.closest(".pre")
    .querySelector("pre").textContent;

  try {
    await navigator.clipboard.writeText(code);
    e.target.textContent = "Скопировано ✓";
  } catch {
    e.target.textContent = "Не удалось скопировать";
  }

  setTimeout(() => {
    e.target.textContent = "Копировать";
  }, 1500);
});

async function send() {
  const message = q.value.trim();

  if (!message || busy) return;

  busy = true;
  go.disabled = true;

  q.value = "";
  q.style.height = "auto";

  add("me", esc(message));

  history.push({
    role:"user",
    content:message
  });

  const box = add("ai",
    '<span class="status">mr.AI думает...</span>');

  try {
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messages:history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера");
    }

    const answer = String(data.answer || "").trim();

    if (!answer) {
      throw new Error("Пустой ответ от сервера");
    }

    history.push({
      role:"assistant",
      content:answer
    });

    box.innerHTML = md(answer);

  } catch (error) {
    history.pop();

    box.textContent =
      "Ошибка: " + (error.message || "Не удалось подключиться");
  }

  busy = false;
  go.disabled = false;
  log.scrollTop = log.scrollHeight;
  q.focus();
}

go.onclick = send;

$("new").onclick = () => {
  if (busy) return;
  history = [];
  welcome();
};

q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 150) + "px";
});

welcome();
</script>

</body>
  </html>
